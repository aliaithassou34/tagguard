# =============================================================================
# Spike Configuration Script
# =============================================================================

if {![info exists gdb_port]} {
    set gdb_port 3333
}

if {![info exists rbb_port]} {
    set rbb_port 9824
}

# Server ======================================================================
tcl_port disabled
telnet_port disabled
gdb_port $gdb_port

# Adapter =====================================================================
adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port $rbb_port

# TAP Declaration for RISC-V CPU ==============================================
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

# Target creation =============================================================
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

# GDB and RISC-V Settings =====================================================
gdb_report_register_access_error enable
riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120
#riscv set_prefer_sba on

# Initialize and Halt =========================================================
scan_chain
init
halt

# Confirmation Message ========================================================
echo "Ready for Remote Connections"
