[project]
name = "adam"
version = "0.0.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Jinja2==3.1.2",
    "psutil==7.0.0",
    "pyelftools==0.29",
    "tensorflow==2.20.0",
    "vunit-hdl==4.7.0"
]

[project.scripts]
adam = "adam.cli.main:main"

[tool.poetry]
packages = [{include = "adam", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
